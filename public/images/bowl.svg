<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none" stroke="#444" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
  <!-- Hand-thrown ceramic bowl — wabi-sabi imperfection -->
  <g opacity="0.85">
    <!-- Bowl rim — slightly asymmetric for hand-thrown feel -->
    <path d="M110 200 Q115 185 140 175 Q170 167 200 165 Q230 167 260 175 Q285 185 290 200 Q285 215 260 223 Q230 230 200 232 Q170 230 140 223 Q115 215 110 200Z" stroke-width="1.3"/>

    <!-- Inner rim line -->
    <path d="M125 200 Q130 190 155 182 Q178 176 200 174 Q222 176 245 182 Q270 190 275 200" stroke-width="0.5" opacity="0.35"/>

    <!-- Bowl body — left wall -->
    <path d="M110 200 Q108 240 115 275 Q125 310 155 330 Q175 342 200 345" stroke-width="1.3"/>

    <!-- Bowl body — right wall -->
    <path d="M290 200 Q292 240 285 275 Q275 310 245 330 Q225 342 200 345" stroke-width="1.3"/>

    <!-- Bottom -->
    <ellipse cx="200" cy="345" rx="45" ry="10" stroke-width="0.8" opacity="0.6"/>

    <!-- Foot ring -->
    <ellipse cx="200" cy="352" rx="30" ry="6" stroke-width="0.6" opacity="0.4"/>

    <!-- Throwing lines — horizontal rings showing hand-thrown marks -->
    <path d="M112 220 Q155 215 200 214 Q245 215 288 220" stroke-width="0.3" opacity="0.2"/>
    <path d="M115 245 Q158 239 200 238 Q242 239 285 245" stroke-width="0.3" opacity="0.18"/>
    <path d="M120 270 Q158 263 200 262 Q242 263 280 270" stroke-width="0.3" opacity="0.15"/>
    <path d="M130 295 Q162 287 200 286 Q238 287 270 295" stroke-width="0.3" opacity="0.12"/>

    <!-- Subtle shadow underneath -->
    <ellipse cx="200" cy="365" rx="60" ry="6" stroke-width="0.4" opacity="0.15"/>

    <!-- Tiny glaze drip mark — wabi-sabi detail -->
    <path d="M155 230 Q154 245 156 260" stroke-width="0.4" opacity="0.25"/>
  </g>
</svg>
