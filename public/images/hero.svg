    <path d="M185 178 Q182 158 188 138 Q193 118 186 95" stroke-width="0.6" opacity="0.3"/>
    <path d="M215 172 Q210 148 217 122 Q223 98 213 70" stroke-width="0.6" opacity="0.35"/>

