    <path d="M150 170 Q155 210 152 250 Q150 280 155 305" stroke-width="0.5" opacity="0.3"/>
    <path d="M200 165 Q198 205 200 245 Q202 280 198 310" stroke-width="0.4" opacity="0.25"/>
