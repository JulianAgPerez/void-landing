    <path d="M210 200 L213 202" stroke-width="0.3" opacity="0.2"/>
    <path d="M180 230 L183 232" stroke-width="0.3" opacity="0.15"/>
    <path d="M230 215 L233 217" stroke-width="0.3" opacity="0.2"/>
    <path d="M190 260 L193 262" stroke-width="0.3" opacity="0.15"/>
